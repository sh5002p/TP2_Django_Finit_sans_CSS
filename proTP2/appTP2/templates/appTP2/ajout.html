<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Livre</title>
</head>
<body>
    <h1>Ajouter un Livre</h1>
    <form method="post" action="/bibliotheque/traitement/">
        {% csrf_token %}
        {{ form.as_ul }}
        <input type="submit" value="Envoyer les données">
    </form>
    <br>
    <a href="{% url 'liste' %}">Retour à la liste des Livres</a>
</body>
</html>
